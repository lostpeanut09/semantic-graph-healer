---
name: Jules AI Code Review

'on':
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

# Prevent multiple concurrent reviews on the same PR
concurrency:
    group: jules-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    review:
        runs-on: ubuntu-latest
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Invoke Jules Reviewer
              uses: google-labs-code/jules-invoke@main
              with:
                  jules_api_key: ${{ secrets.JULES_API_KEY }}
                  prompt: |
                      You are a senior software engineer and security auditor. Review the changes in this Pull Request.
                      
                      Your goal is to identify:
                      1. [BLOCKING] Critical security flaws (like insecure ID generation) or logic bugs.
                      2. [WARN] Performance issues (like inefficient Set operations) or missing error handling.
                      3. [NIT] Style improvements or accessibility gaps (like missing aria-labels).
                      
                      Rules:
                      - Be concise and professional.
                      - Adhere to the project standards defined in AGENTS.md.
                      - If the code looks great, provide a brief positive summary.
                      - Post your review as a single comprehensive PR comment.
                  include_last_commit: true
                  include_commit_log: true
