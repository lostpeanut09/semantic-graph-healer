name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Check Version Consistency
              run: npm run check-version

            - name: Build Plugin
              run: npm run build

            - name: Production Release
              # Trigger: v2.3.1 production gate audit
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$REF_NAME" \
                    --title "Release $REF_NAME" \
                    --generate-notes \
                    || echo "Release already exists"

                  for file in main.js worker.js ladybug-worker.js manifest.json styles.css; do
                    if [ -f "$file" ]; then
                      gh release upload "$REF_NAME" "$file" --clobber
                    fi
                  done
