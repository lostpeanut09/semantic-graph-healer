name: Quality Pipeline
# Trigger: v2.3.1 production gate audit

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    quality:
        name: Lint, Test & Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install Dependencies
              run: npm install --legacy-peer-deps

            - name: Format Check
              run: npx prettier --config .config/.prettierrc --ignore-path .config/.prettierignore --check .

            - name: YAML Lint
              run: npm run lint:yaml

            - name: Lint (TS/JS)
              run: npm run lint

            - name: Lint (CSS)
              run: npm run lint:css

            - name: Dependency Audit (Knip)
              run: npm run knip

            - name: Run Tests
              run: npm run test

            - name: Build Check
              run: npm run build

    verify-platform-agnostic:
        name: Platform Agnostic Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Scan for Windows-specific separators
              run: |
                  # Detect hardcoded Windows absolute paths (e.g., C:\Users\foo or C:\\Users\\foo)
                  # without matching regular regex escapes or single backslashes in comments.
                  ! grep -rP '[a-zA-Z]:\\\\[A-Za-z0-9_]+\\\\[A-Za-z0-9_]+' src --exclude-dir=node_modules --exclude-dir=.git
                  ! grep -rP '[a-zA-Z]:\\\\\\\\[A-Za-z0-9_]+\\\\\\\\[A-Za-z0-9_]+' src --exclude-dir=node_modules --exclude-dir=.git
